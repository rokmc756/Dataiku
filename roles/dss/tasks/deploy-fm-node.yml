---
- name: Create Directory for Dataiku DSS FM Node
  file:
    path: "{{ _fm.data_path }}"
    state: directory
    owner: jomoon
    group: jomoon
    mode: 0755
  register: create_data_dir
- debug: msg={{ create_data_dir }}
  when: print_debug == true


- name: Install Dataiku DSS FM Node
  become_user: "{{ _dss.user }}"
  shell: |
    dataiku-fm-{{ _dss.major_version }}.{{ _dss.minor_version }}.{{ _dss.patch_version }}/installer.sh -d {{ _fm.data_path }} -c AWS ( or GCP or Azure ) -p {{ _fm.port }} # -l LICENSE_FILE]
  register: install_dss_fm_node
  args:
    chdir: "{{ _dss.base_path }}"
- debug: msg={{ install_dss_fm_node }}
  when: print_debug == true


- name: Setup PostgreSQL Database Connection
  become_user: "{{ _dss.user }}"
  lineinfile:
    dest: "{{ _govern.data_path }}/config/dip.properties"  # user-data.json
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: "{{ item.state }}"
    backrefs: "{{ item.backrefs }}"
  register: setup_pgsql_db_connection
  with_items:
    - { regexp: "^psql.jdbc.url=", line: "psql.jdbc.url=jdbc:postgresql://{{ groups['postgres'][0] }}:5432/{{ _fm.pgsql.db_name }}", state: present, backrefs: no }
    - { regexp: "^psql.jdbc.user=", line: "psql.jdbc.user={{ _fm.pgsql.db_user }}", state: present, backrefs: yes }
    - { regexp: "^psql.jdbc.password", line: "psql.jdbc.password={{ _fm.pgsql.db_password }}", state: present, backrefs: yes }
- debug: msg={{ setup_pgsql_db_connection }}
  when: print_debug == true


- name: Issue Bootstrapping the Initial Configuration of FM
  become_user: "{{ _dss.user }}"
  shell: |
    bin/fmadmin initial-setup {{ _fm.pgsql.db_user }} {{ _fm.pgsql.db_password }}
  register: issue_initial_config
  args:
    chdir: "{{ _fm.data_path }}"
- debug: msg={{ issue_initial_config }}
  when: print_debug == true


- name: Enable Startup Dataiku DSS FM Node At Boot Time
  shell: |
    dataiku-fm-{{ _dss.major_version }}.{{ _dss.minor_version }}.{{ _dss.patch_version }}//scripts/install/install-boot.sh {{ _fm.data_path }} {{ _dss.user }}
  register: enable_startup_dss_fm_node
  args:
    chdir: "{{ _dss.base_path }}"
- debug: msg={{ enable_startup_dss_fm_node }}
  when: print_debug == true


- name: Enable and Start Systemd Service for Dataiku DSS FM Node
  systemd:
    daemon_reload: yes
    name: dataiku
    enabled: yes
    state: started
  register: enable_fm_node_systemd_service
- debug: msg={{ enable_fm_node_systemd_service }}
  when: print_debug == true


